<body>
  <div>
    <div class="ui one column stackable center aligned page grid">
      <div class="column twelve wide">
        <h1>Initiate a fire simulation</h1>

        <br />
        <br />

        <form id="simulation_form" class="ui form" method="POST">
          <simulation-description></simulation-description>
          <br />
          <add-catalog></add-catalog>

          <h2 class="ui header">Step 2: Ignition location and time</h2>

          <simulation-start-and-end-times></simulation-start-and-end-times>
          <cycle-start></cycle-start>

          <p>
            Select fire location by <b>clicking on the map</b> or filling out
            the boxes below
          </p>

          <div id="map"></div>

          <single-ignition></single-ignition>
          <validation-errors></validation-errors>
          <br />

          <br />
          <ignition-profile></ignition-profile>

          <br />
          <br />
          <br />

          <ignition-button></ignition-button>
        </form>
        <a href="/jobs" class="ui right floated blue button">Home</a>

        <div>
          <p>
            <a href="https://wildfirecenter.org/" target="_blank"
              >SJSU WIRC, Fire Modeling Group,
              <script>
                document.write(new Date().getFullYear());
              </script></a
            >
          </p>
        </div>
      </div>
    </div>
  </div>
